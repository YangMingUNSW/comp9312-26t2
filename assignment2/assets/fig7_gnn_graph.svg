<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-label="Four-vertex graph for GNN mean aggregation">
  <style>
    .graph-svg { background: #fff; }
    .graph-edge { stroke: #6c757d; stroke-width: 2.4; stroke-linecap: round; }
    .directed-edge { fill: none; stroke: #495057; stroke-width: 2.2;
                     stroke-linecap: round; stroke-linejoin: round; }
    .tree-edge { fill: none; stroke: #212529; stroke-width: 2.2; }
    .graph-node, .tree-node { fill: #fff; stroke: #212529; stroke-width: 2.2; }
    .graph-label { font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
                   font-size: 18px; font-weight: 700; text-anchor: middle;
                   dominant-baseline: central; }
    .graph-note { font-size: 13px; fill: #6c757d; text-anchor: middle; }
  </style>

          <line class="graph-edge" x1="100" y1="75" x2="245" y2="75" />
          <line class="graph-edge" x1="100" y1="75" x2="175" y2="205" />
          <line class="graph-edge" x1="245" y1="75" x2="175" y2="205" />
          <line class="graph-edge" x1="175" y1="205" x2="375" y2="205" />
          <circle class="graph-node" cx="100" cy="75" r="22" /><text class="graph-label" x="100" y="75">A</text>
          <circle class="graph-node" cx="245" cy="75" r="22" /><text class="graph-label" x="245" y="75">B</text>
          <circle class="graph-node" cx="175" cy="205" r="22" /><text class="graph-label" x="175" y="205">C</text>
          <circle class="graph-node" cx="375" cy="205" r="22" /><text class="graph-label" x="375" y="205">D</text>
          <text class="graph-note" x="250" y="262">Figure 7: graph for Q4</text>
        </svg>
