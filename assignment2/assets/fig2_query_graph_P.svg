<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 235" role="img" aria-label="Query graph P, a triangle with one additional vertex">
  <style>
    .graph-svg { background: #fff; }
    .graph-edge { stroke: #6c757d; stroke-width: 2.4; stroke-linecap: round; }
    .directed-edge { fill: none; stroke: #495057; stroke-width: 2.2;
                     stroke-linecap: round; stroke-linejoin: round; }
    .tree-edge { fill: none; stroke: #212529; stroke-width: 2.2; }
    .graph-node, .tree-node { fill: #fff; stroke: #212529; stroke-width: 2.2; }
    .graph-label { font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
                   font-size: 18px; font-weight: 700; text-anchor: middle;
                   dominant-baseline: central; }
    .graph-note { font-size: 13px; fill: #6c757d; text-anchor: middle; }
  </style>

          <line class="graph-edge" x1="100" y1="75" x2="220" y2="75" />
          <line class="graph-edge" x1="100" y1="75" x2="160" y2="160" />
          <line class="graph-edge" x1="220" y1="75" x2="160" y2="160" />
          <line class="graph-edge" x1="160" y1="160" x2="285" y2="160" />
          <circle class="graph-node" cx="100" cy="75" r="21" /><text class="graph-label" x="100" y="75">p</text>
          <circle class="graph-node" cx="220" cy="75" r="21" /><text class="graph-label" x="220" y="75">q</text>
          <circle class="graph-node" cx="160" cy="160" r="21" /><text class="graph-label" x="160" y="160">r</text>
          <circle class="graph-node" cx="285" cy="160" r="21" /><text class="graph-label" x="285" y="160">s</text>
          <text class="graph-note" x="180" y="215">Figure 2: query graph P</text>
        </svg>
